[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermaldeck"
version = "0.1.0"
description = "Local NVIDIA GPU and Gigabyte motherboard fan dashboard for Linux"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JR-Yu6197"}]
readme = "README.md"

[project.scripts]
thermaldeck = "thermaldeck.__main__:main"

[tool.setuptools]
packages = ["thermaldeck"]
